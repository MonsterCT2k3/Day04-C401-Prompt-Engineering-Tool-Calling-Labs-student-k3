tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user a clarifying question when critical info (like account handle or URL) is missing, or ask for confirmation (yes_no) before sending messages."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi gửi người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: text (hỏi thêm tin), yes_no (xác nhận)"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Get recent tweets/posts FROM a specific user account using their handle/screenname (e.g. sama for Sam Altman, elonmusk for Elon Musk)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter handle/screenname without @ (e.g. sama)"}
        limit: {type: integer, default: 5, description: "MUST be an integer number (e.g. 5, not '5')"}
      required: [screenname]

  - name: social_search
    description: "Search social media (Twitter/X) posts by keyword or topic (e.g. GPT-5, OpenAI)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Core topic keyword"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp bài viết"}
        limit: {type: integer, default: 5, description: "MUST be an integer number (e.g. 5, not '5')"}
      required: [query]

  - name: lookup
    description: "Search the web or news articles for information on topics or current events."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Core topic keyword only (e.g. 'AI', not 'Tin tức AI hôm nay')"}
        topic: {type: string, enum: [general, news], default: "general", description: "Loại thông tin: general (web chung), news (tin tức)"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian bài viết"}
        max_results: {type: integer, default: 5, description: "MUST be an integer number (e.g. 5, not '5')"}
      required: [query]

  - name: fetch
    description: "Fetch and read the full text content from a specified web URL."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ"}
      required: [url]

  - name: format
    description: "Format retrieved research items into a clean markdown document or report."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các item dữ liệu"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Mẫu trình bày"}
        headline: {type: string, default: "", description: "Tiêu đề báo cáo"}
      required: [items, template]

  - name: weather
    description: "Get current weather for a city, university, or landmark (e.g. Hanoi, Ho Chi Minh, Da Nang, Tokyo, Paris, VinUni, Bách Khoa Hà Nội, Stanford University, Harvard, MIT)."
    parameters:
      type: object
      properties:
        city: {type: string, default: "Hanoi", description: "Tên thành phố, trường đại học, hoặc địa danh cần xem thời tiết"}
      required: [city]

  # ---------------- Bonus / Optional tools ----------------
  - name: send
    description: "Send or publish a message to Telegram channel. Require prior confirmation via clarify."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung tin nhắn"}
        confirmed: {type: boolean, default: false, description: "Cờ đã xác nhận với người dùng"}
      required: [text]

  - name: policy
    description: "Search internal company policy documents."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tra cứu quy định"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Lĩnh vực quy định"}
        top_k: {type: integer, default: 3, description: "Số lượng đoạn văn"}
      required: [query]

  - name: papers
    description: "Search academic research papers on arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa bài báo khoa học"}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Cách sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Download and extract text content from an arXiv PDF."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "URL hoặc ID bài báo arXiv"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa"}
      required: [arxiv_url]
