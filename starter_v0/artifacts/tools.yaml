  # ---------------- Rental Tools ----------------
  - name: search_apartments
    description: |
      Tìm kiếm nhà trọ hoặc căn hộ cho thuê dựa trên các tiêu chí: khu vực, giá cả, và loại phòng.
    parameters:
      type: object
      properties:
        location: {type: string, default: "", description: "Khu vực muốn tìm (VD: 'Cầu Giấy', 'Quận 1')"}
        min_price: {type: integer, default: 0, description: "Giá tối thiểu (VNĐ)"}
        max_price: {type: integer, default: 100000000, description: "Giá tối đa (VNĐ)"}
        room_type: {type: string, enum: [phong_tro, chung_cu_mini, chung_cu, nha_nguyen_can], default: "phong_tro", description: "Loại phòng"}
      required: [location]

  - name: get_apartment_details
    description: |
      Lấy thông tin chi tiết của một nhà trọ/căn hộ dựa trên ID (địa chỉ cụ thể, nội thất, điện nước, SĐT chủ).
    parameters:
      type: object
      properties:
        apartment_id: {type: string, description: "ID của căn hộ (được trả về từ search_apartments)"}
      required: [apartment_id]

  - name: book_viewing
    description: |
      Đặt lịch hẹn đến xem nhà trọ/căn hộ. Yêu cầu có đầy đủ ID, tên, SĐT và thời gian hẹn.
    parameters:
      type: object
      properties:
        apartment_id: {type: string, description: "ID của căn hộ"}
        customer_name: {type: string, description: "Tên người đặt"}
        phone_number: {type: string, description: "Số điện thoại liên hệ"}
        viewing_time: {type: string, description: "Thời gian muốn xem (VD: '15h chiều mai')"}
      required: [apartment_id, customer_name, phone_number, viewing_time]
